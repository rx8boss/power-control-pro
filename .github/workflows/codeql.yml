name: CodeQL · Windows/C#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-csharp:
    name: C#-Analyse
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v5

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: WPF-App bauen
        run: dotnet build .\src\PowerLeitstandPro\PowerControlProWpf.csproj --configuration Release --no-incremental

      - name: Funktionstests ausführen
        run: dotnet run --project .\tests\ActionSmoke\ActionSmoke.csproj --configuration Release

      - name: Analyse hochladen
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
