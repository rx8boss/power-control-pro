<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';"><title>Power Control PRO</title><link id="theme-style" rel="stylesheet" href="css/standard.css"></head>
<body><header class="app-header"><img class="brand-mark" src="assets/icons/bolt.svg" alt=""><div class="brand"><h1>Power Control <span>PRO</span></h1><p>SCHNELL / SICHER / ZUVERLÄSSIG</p></div><div class="window-controls"><button id="settings-toggle">⚙</button><button id="window-minimize">−</button><button id="window-close">×</button></div></header>
<main class="grid"><section class="card immediate-card"><h2>Sofort</h2><p>Direkte Systemaktionen</p><div class="action-grid"><button data-action="shutdown">Herunterfahren</button><button data-action="restart">Neustart</button><button data-action="logout">Abmelden</button><button data-action="lock">Sperren</button></div></section><section class="card timer-card"><h2>Timer</h2><output id="timer-duration-label">5 Minuten</output><input id="timer-duration" type="hidden" value="300"><button id="timer-shutdown">Herunterfahren</button><button id="timer-restart">Neustart</button><button id="timer-abort" disabled>Timer abbrechen <span id="countdown"></span></button></section><section class="card status-card"><h2>Status</h2><div id="status">Bereit</div></section><section class="card log-card"><h2>Log PRO</h2><div id="log"></div></section></main>
<script src="locales/de.js"></script><script src="locales/en.js"></script><script src="renderer.js"></script></body></html>
