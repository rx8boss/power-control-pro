<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self';">
<meta charset="UTF-8">
<title>Power Control PRO</title>
<link id="theme-style" rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>⚡ Power Control <span class="neon">PRO</span></h1>
<div class="theme-toggle"><button id="theme-toggle-btn">🌙 Neon</button></div>
<div class="grid">
  <div class="card"><h3>⚡ Sofort</h3><div class="button-grid">
    <button id="btn-lock">🔒 Sperren</button><button id="btn-logout">🚪 Abmelden</button>
    <button id="btn-shutdown" class="red">⏻ Herunterfahren</button><button id="btn-restart">🔄 Neustart</button>
  </div></div>
  <div class="card"><h3>⏱ Timer</h3><label class="full">Zeit auswählen</label>
    <select id="timer-dauer" class="full">
      <option value="60">1 Minute</option><option value="120">2 Minuten</option><option value="180">3 Minuten</option>
      <option value="300" selected>5 Minuten</option><option value="600">10 Minuten</option><option value="900">15 Minuten</option>
      <option value="1200">20 Minuten</option><option value="1800">30 Minuten</option><option value="2700">45 Minuten</option>
      <option value="3600">1 Stunde</option><option value="7200">2 Stunden</option>
    </select>
    <button id="btn-shutdown-timer" class="full">⏱ Herunterfahren</button>
    <button id="btn-restart-timer" class="full">🔄 Neustart</button>
    <button id="btn-abort" class="abort full" disabled>⏹ Timer abbrechen</button>
    <div id="countdown" class="full"></div>
  </div>
  <div class="card"><h3>📊 Status</h3><div id="status" class="full">Bereit</div>
    <label class="autostart full"><input id="autostart" type="checkbox"> Mit Windows starten</label>
  </div>
  <div class="card"><h3>🧾 Log PRO</h3><div class="log-actions full">
    <button id="btn-refresh-log">🔄 Aktualisieren</button><button id="btn-clear-log" class="gray">🧹 Löschen</button>
    <button id="btn-open-log">📂 Datei öffnen</button>
  </div><div id="log" class="logbox full"></div></div>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><h2>Bestätigung</h2><p id="modal-text"></p>
  <div class="modal-buttons"><button id="modal-ok">OK</button><button id="modal-cancel" class="gray">Abbrechen</button></div>
</div></div>
<script src="renderer.js"></script>
</body>
</html>
